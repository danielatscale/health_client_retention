unique_name: health_client_retention
object_type: model
label: Health Client Renewal & Retention
description: 'Employer-client book (ASO + insured): monthly membership/revenue/claims snapshots, renewals with outcome
  and rate action, product changes at renewal, and service cases. Client data is secured by the Client Offshore
  Access group-based row security object.'
visible: true
relationships:
- unique_name: fact_client_month_snapshot_date
  from:
    dataset: fact_client_month
    join_columns:
    - snapshot_date_key
  to:
    dimension: Date Dimension
    level: Day
  role_play: Snapshot {0}
- unique_name: fact_client_month_client
  from:
    dataset: fact_client_month
    join_columns:
    - client_id
  to:
    dimension: Client Dimension
    level: Client
- unique_name: fact_client_month_product
  from:
    dataset: fact_client_month
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_renewal_renewal_date
  from:
    dataset: fact_renewal
    join_columns:
    - renewal_date_key
  to:
    dimension: Date Dimension
    level: Day
  role_play: Renewal {0}
- unique_name: fact_renewal_client
  from:
    dataset: fact_renewal
    join_columns:
    - client_id
  to:
    dimension: Client Dimension
    level: Client
- unique_name: fact_renewal_product_renewal_date
  from:
    dataset: fact_renewal_product
    join_columns:
    - renewal_date_key
  to:
    dimension: Date Dimension
    level: Day
  role_play: Renewal {0}
- unique_name: fact_renewal_product_client
  from:
    dataset: fact_renewal_product
    join_columns:
    - client_id
  to:
    dimension: Client Dimension
    level: Client
- unique_name: fact_renewal_product_product
  from:
    dataset: fact_renewal_product
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_service_case_opened_date
  from:
    dataset: fact_service_case
    join_columns:
    - opened_date_key
  to:
    dimension: Date Dimension
    level: Day
  role_play: Opened {0}
- unique_name: fact_service_case_closed_date
  from:
    dataset: fact_service_case
    join_columns:
    - closed_date_key
  to:
    dimension: Date Dimension
    level: Day
  role_play: Closed {0}
- unique_name: fact_service_case_client
  from:
    dataset: fact_service_case
    join_columns:
    - client_id
  to:
    dimension: Client Dimension
    level: Client
