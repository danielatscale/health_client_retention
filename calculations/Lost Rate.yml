unique_name: Lost Rate
object_type: metric_calc
label: Lost Rate
description: Share of renewals lost = Lost Count / Renewal Count.
expression: CASE WHEN ISEMPTY([Measures].[Renewal Count]) OR [Measures].[Renewal Count] = 0 THEN NULL ELSE [Measures].[Lost
  Count] / [Measures].[Renewal Count] END
format: percent
